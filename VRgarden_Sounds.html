<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>VRgarden Sound Library</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Archivo:wght@400;600;800&family=Space+Mono:wght@400;700&display=swap" rel="stylesheet">
<style>
:root{--bg:#f4f4ef;--ink:#16181a;--muted:#5d6166;--card:#fff;--line:#d9dbd2;--lime:#b6e03a;--lime-ink:#2f3d00;--chip:#eef0e8;--wave:#c7cbbd}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#121413;--ink:#ecefe8;--muted:#9ba19a;--card:#1b1e1c;--line:#2c312d;--chip:#242824;--wave:#3a403a}}
:root[data-theme="dark"]{--bg:#121413;--ink:#ecefe8;--muted:#9ba19a;--card:#1b1e1c;--line:#2c312d;--chip:#242824;--wave:#3a403a}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.45 Archivo,system-ui,sans-serif}
.wrap{max-width:1100px;margin:0 auto;padding:32px 16px 48px}
header{display:flex;flex-wrap:wrap;justify-content:space-between;align-items:flex-end;gap:16px;border-bottom:1px solid var(--line);padding-bottom:18px}
h1{font-size:clamp(30px,5vw,46px);line-height:1.02;margin:0;font-weight:800;letter-spacing:-.02em}
h1 span{background:var(--lime);color:var(--lime-ink);padding:0 .12em}
.sub{color:var(--muted);margin:8px 0 0;max-width:60ch}
.tally{display:flex;gap:18px;flex-wrap:wrap;font:13px "Space Mono",monospace;color:var(--muted)}
.tally b{display:block;font:800 24px Archivo,sans-serif;color:var(--ink)}
.bar{position:sticky;top:0;z-index:5;background:var(--bg);display:grid;grid-template-columns:minmax(0,320px);gap:10px;padding:14px 0;border-bottom:1px solid var(--line)}
@media (max-width:720px){.bar{grid-template-columns:1fr}}
label{display:flex;flex-direction:column;gap:4px;font:11px "Space Mono",monospace;text-transform:uppercase;letter-spacing:.06em;color:var(--muted);min-width:0}
input,select{font:14px Archivo,sans-serif;color:var(--ink);background:var(--card);border:1px solid var(--line);border-radius:8px;padding:8px 10px;width:100%;min-width:0}
.seg{display:flex;align-items:flex-end;gap:6px}
.seg button{font:600 13px Archivo,sans-serif;border:1px solid var(--line);background:var(--card);color:var(--ink);border-radius:999px;padding:8px 12px;cursor:pointer}
.seg button[aria-pressed="true"]{background:var(--lime);color:var(--lime-ink);border-color:var(--lime)}
.status{font:13px "Space Mono",monospace;color:var(--muted);margin:14px 0 6px}
h2{font:800 20px Archivo,sans-serif;margin:28px 0 10px;display:flex;align-items:baseline;gap:10px}
h2 small{font:400 12px "Space Mono",monospace;color:var(--muted)}
.list{display:flex;flex-direction:column;gap:8px}
.row{display:grid;grid-template-columns:64px 1fr auto;gap:14px;align-items:center;background:var(--card);border:1px solid var(--line);border-radius:12px;padding:12px 14px}
.dur{font:700 13px "Space Mono",monospace;text-align:center}
.dur i{display:block;height:22px;margin-bottom:4px;background:repeating-linear-gradient(90deg,var(--wave) 0 2px,transparent 2px 4px);-webkit-mask:linear-gradient(0deg,#000 var(--h),transparent var(--h));mask:linear-gradient(0deg,#000 var(--h),transparent var(--h));border-radius:2px}
.t{margin:0;font-weight:600;overflow-wrap:anywhere;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.row.open .t{-webkit-line-clamp:unset}
.meta{display:flex;flex-wrap:wrap;gap:6px;margin-top:6px}
.tag{font:12px "Space Mono",monospace;background:var(--chip);border-radius:6px;padding:2px 7px;color:var(--muted)}
.tag.cat{background:var(--lime);color:var(--lime-ink);font-weight:700}
.note{font-size:12.5px;color:var(--muted);margin:6px 0 0}
.go{display:flex;flex-direction:column;align-items:flex-end;gap:6px}
.cost{font:700 13px "Space Mono",monospace}
.go a{font:700 13px Archivo,sans-serif;text-decoration:none;color:var(--lime-ink);background:var(--lime);padding:7px 11px;border-radius:8px;white-space:nowrap}
.go a.s{background:var(--chip);color:var(--ink)}
.more{background:none;border:0;padding:0;margin-top:4px;font:12px "Space Mono",monospace;color:var(--muted);cursor:pointer;text-decoration:underline}
@media (max-width:560px){.row{grid-template-columns:52px 1fr}.go{grid-column:1/-1;flex-direction:row;justify-content:space-between;align-items:center}}
footer{margin-top:36px;font-size:12.5px;color:var(--muted);border-top:1px solid var(--line);padding-top:14px}
a:focus-visible,button:focus-visible,input:focus-visible,select:focus-visible{outline:2px solid var(--lime);outline-offset:2px}
</style>
</head>
<body>
<div class="wrap">
<header>
  <div>
    <h1>VRgarden <span>sound library</span></h1>
    <p class="sub">Sound effects bought from Sounddogs for the VRgarden project. The files are in the common folder on each computer; every entry links to its page on Sounddogs to preview it.</p>
  </div>
  <div class="tally" id="tally"></div>
</header>
<section class="bar" aria-label="Filters">
  <label for="fc">Category<select id="fc"></select></label>
</section>
<div class="status" id="count"></div>
<main id="out"></main>
<footer>VRgarden (October 2026)</footer>
</div>

const fmt=s=>{s=Math.round(s);const m=Math.floor(s/60),x=s%60;return m+':'+String(x).padStart(2,'0')};

const maxS=Math.log(Math.max(...DATA.map(d=>d.sec))+1);

  const long=d.title.length>110;

  <div class="meta"><span class="tag cat">${esc(d.cat)}</span><span class="tag">${esc(d.lib)}</span><span class="tag">${d.ch===1?'Mono':d.ch===2?'Stereo':d.ch+' channels'}</span><span class="tag">${d.bit}-bit / ${(d.sr/1000).toFixed(d.sr%1000?1:0)} kHz</span>${d.id?`<span class="tag">ID ${d.id}</span>`:''}<span class="tag">${esc(d.cost)}</span></div>
  ${d.note?`<p class="note">${esc(d.note)}</p>`:''}</div>
  <div class="go"><a class="${d.s?'s':''}" href="${esc(d.url)}" target="_blank" rel="noopener">${d.s?'Search Sounddogs ↗':'Open on Sounddogs ↗'}</a></div></article>`;
}
function render(){
  const c=$('fc').value;
  const L=DATA.filter(d=>!c||d.cat===c);
  $('out').innerHTML=L.length?`<div class="list">${L.map(row).join('')}</div>`:'<p class="status">No sounds match.</p>';
  $('count').textContent=`${L.length} of ${DATA.length} sounds shown`;
}
$('out').addEventListener('click',e=>{const b=e.target.closest('.more');if(!b)return;const r=b.closest('.row');r.classList.toggle('open');b.textContent=r.classList.contains('open')?'Show less':'Show all'});
$('fc').addEventListener('input',render);
render();
</script>
</body>
</html>
